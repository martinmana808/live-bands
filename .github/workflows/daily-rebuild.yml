name: daily-rebuild

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 ART
  workflow_dispatch:
    inputs:
      send_digest:
        description: 'Send the Telegram digest regardless of the configured day'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch events
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run fetch

      - name: Validate events.json
        run: |
          node -e "
            import('node:fs').then(fs => {
              const e = JSON.parse(fs.readFileSync('./data/events.json', 'utf8'));
              if (!Array.isArray(e)) { console.error('not an array'); process.exit(1); }
              for (const x of e) {
                if (!x.id || !x.artist || !x.date || !x.venue || !x.firstSeenAt) {
                  console.error('missing required field', x); process.exit(1);
                }
              }
              console.log('OK', e.length, 'events');
            });
          "

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/artists.json data/health.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Send digest
        if: github.event_name == 'schedule' || inputs.send_digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_DAY: ${{ vars.DIGEST_DAY }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "No Telegram credentials configured, skipping digest"
            exit 0
          fi
          DAY="${DIGEST_DAY:-Sat}"
          TODAY=$(date -u +%a)
          if [ "$DAY" != "daily" ] && [ "$TODAY" != "$DAY" ]; then
            echo "Digest day is $DAY, today is $TODAY - skipping"
            exit 0
          fi
          npm run digest

      - name: Commit digest state
        run: |
          git add data/digest-state.json
          if git diff --cached --quiet; then
            echo "No digest state change"
          else
            git commit -m "chore: digest sent ($(date -u +%Y-%m-%d))"
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment

  notify-on-stale:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily rebuild failed (${new Date().toISOString().slice(0,10)})`,
              body: `A source that worked previously returned nothing, the stale-data safety net tripped, or the build failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck data/health.json for per-adapter counts.`,
            });
